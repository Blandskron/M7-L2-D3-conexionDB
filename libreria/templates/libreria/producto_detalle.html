{% extends 'libreria/base.html' %}
{% block content %}<h1>{{ producto.nombre }}</h1><dl><dt>SKU</dt><dd>{{ producto.sku }}</dd><dt>Descripción</dt><dd>{{ producto.descripcion|default:'Sin descripción' }}</dd><dt>Precio</dt><dd>${{ producto.precio }}</dd><dt>Stock</dt><dd>{{ producto.stock }}</dd><dt>Activo</dt><dd>{{ producto.activo|yesno:'Sí,No' }}</dd></dl><a class="boton" href="{% url 'producto_editar' producto.pk %}">Editar</a>{% endblock %}
